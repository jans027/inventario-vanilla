<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <!-- Header will be injected by JavaScript -->
    <div id="headerContainer"></div>

    <!-- Main layout -->
    <div class="main-container">
        <!-- Sidebar will be injected by JavaScript -->
        <div id="sidebarContainer"></div>

        <!-- Main content -->
        <main class="content">
            <div class="page-header">
                <div>
                    <h2>Usuarios</h2>
                    <p class="subtitle">Gestion de usuarios del sistema</p>
                </div>
                <button class="btn-add" onclick="openUserModal()">+ Agregar Usuario</button>
            </div>

            <!-- Search bar -->
            <div class="search-bar">
                <input 
                    type="text" 
                    id="searchUser" 
                    placeholder="Buscar usuario por nombre o correo..."
                    oninput="searchUsers()"
                >
            </div>

            <!-- Users table -->
            <div class="table-container">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Users will be inserted here -->
                    </tbody>
                </table>
                <p id="emptyUsers" class="empty-message" style="display: none;">
                    No se encontraron usuarios
                </p>
            </div>
        </main>
    </div>

    <!-- User Modal (Add/Edit) -->
    <div id="userModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="userModalTitle">Agregar Usuario</h3>
                <button class="modal-close" onclick="closeUserModal()">X</button>
            </div>
            <div class="modal-body">
                <form id="userForm" onsubmit="saveUser(event)">
                    <input type="hidden" id="userId">

                    <div class="form-group">
                        <label for="userName">Nombre completo</label>
                        <input type="text" id="userName" required>
                    </div>

                    <div class="form-group">
                        <label for="userEmail">Correo electronico</label>
                        <input type="email" id="userEmail" required>
                    </div>

                    <div class="form-group">
                        <label for="userPassword">Contrasena</label>
                        <input type="password" id="userPassword" placeholder="Dejar vacio para no cambiar">
                        <small class="form-hint">Solo complete si desea cambiar la contrasena</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="userRole">Rol</label>
                            <select id="userRole" required>
                                <option value="">Seleccione un rol</option>
                                <option value="admin">Administrador</option>
                                <option value="vendedor">Vendedor</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="userStatus">Estado</label>
                            <select id="userStatus" required>
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <p id="userError" class="form-error"></p>

                    <div class="modal-footer">
                        <button type="button" class="btn-cancel" onclick="closeUserModal()">Cancelar</button>
                        <button type="submit" class="btn-save">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteUserModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-small">
            <div class="modal-header">
                <h3>Confirmar eliminacion</h3>
                <button class="modal-close" onclick="closeDeleteUserModal()">X</button>
            </div>
            <div class="modal-body">
                <p>Esta seguro que desea eliminar este usuario?</p>
                <p class="delete-warning">Esta accion no se puede deshacer.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeDeleteUserModal()">Cancelar</button>
                <button type="button" class="btn-delete" onclick="confirmDeleteUser()">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
